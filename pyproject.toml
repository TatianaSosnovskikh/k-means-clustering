[project]
name = "k-means-clustering"
version = "0.1.0"
description = "Лабораторная работа: Алгоритм k-means на Python"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.4.0",
    "numpy>=1.21.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[tool.mypy]
strict = true
exclude = [
    "^venv/",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "D"] # Включаем проверку ошибок, стиля и docstrings

[tool.ruff.lint.pydocstyle]
convention = "google"   # Указываем стиль документации Google, который мы использовали

[[tool.mypy.overrides]]
module = ["matplotlib.*", "numpy.*"]
ignore_missing_imports = true # Игнорируем отсутствие файлов типов у внешних библиотек
